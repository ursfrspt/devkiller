name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_tag="v$version"
            release_title="DevKiller $version"
            prerelease="false"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
            release_tag="v$version"
            release_title="DevKiller $version"
            prerelease="false"
          else
            release_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
            version="0.0.${GITHUB_RUN_NUMBER}"
            release_title="DevKiller Nightly ${release_tag}"
            prerelease="true"
          fi

          echo "DEVKILLER_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$release_title" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Build package
        run: swift build

      - name: Configure Developer ID signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVKILLER_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVKILLER_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.DEVKILLER_KEYCHAIN_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.DEVKILLER_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            echo "Developer ID certificate secret not set; creating an unsigned test release."
            exit 0
          fi

          cert_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/devkiller-signing.keychain-db"
          keychain_password="${KEYCHAIN_PASSWORD:-temporary-devkiller-keychain}"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$cert_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          if [[ -z "$CODESIGN_IDENTITY" ]]; then
            echo "DEVKILLER_CODESIGN_IDENTITY is required when signing is enabled" >&2
            exit 1
          fi

          echo "DEVKILLER_CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"

          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            xcrun notarytool store-credentials devkiller-notary \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            echo "DEVKILLER_NOTARY_PROFILE=devkiller-notary" >> "$GITHUB_ENV"
          fi

      - name: Package app
        run: ./scripts/package-zip.sh

      - name: Notarize zip
        run: |
          if [[ -n "${DEVKILLER_NOTARY_PROFILE:-}" ]]; then
            ./scripts/notarize-zip.sh "dist/DevKiller-${DEVKILLER_VERSION}.zip"
          else
            echo "Notary profile not configured; skipping notarization."
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="$(mktemp)"
          cat > "$release_notes" <<EOF
          ${RELEASE_TITLE}

          Download DevKiller-${DEVKILLER_VERSION}.zip, unzip it, and move DevKiller.app to Applications.

          SHA-256 checksum is attached as DevKiller-${DEVKILLER_VERSION}.zip.sha256.
          EOF

          args=(
            "$RELEASE_TAG"
            "dist/DevKiller-${DEVKILLER_VERSION}.zip" \
            "dist/DevKiller-${DEVKILLER_VERSION}.zip.sha256" \
            --title "$RELEASE_TITLE" \
            --notes-file "$release_notes"
          )

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi

          if [[ "${RELEASE_PRERELEASE:-false}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
